<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música - Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #1e1e24;
            --card-bg: rgba(30, 30, 36, 0.85);
            --accent-orange: #FFB380;
            --accent-lilac: #D8B4FE;
            --text-main: #FFF1E6;
            --text-muted: #D1C4E9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2A2438, #1E1E24);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 12px;
        }

        .widget-container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(216, 180, 254, 0.2);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-upload {
            background: rgba(255, 179, 128, 0.15);
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-upload:active {
            transform: scale(0.95);
            background: var(--accent-orange);
            color: #1e1e24;
        }

        .player-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .album-art {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-lilac));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            color: #1e1e24;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(255, 179, 128, 0.3);
        }

        .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .track-artist {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-lilac));
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 2px 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .ctrl-btn:hover {
            color: var(--accent-orange);
        }

        .ctrl-btn:active {
            transform: scale(0.9);
        }

        .play-pause-btn {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-lilac));
            color: #1e1e24;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(216, 180, 254, 0.3);
            cursor: pointer;
            border: none;
        }

        .ctrl-btn.active {
            color: var(--accent-lilac);
            text-shadow: 0 0 8px rgba(216, 180, 254, 0.6);
        }

        .playlist-toggle {
            text-align: center;
            font-size: 0.75rem;
            color: var(--accent-lilac);
            cursor: pointer;
            background: rgba(216, 180, 254, 0.08);
            padding: 4px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .playlist-toggle:hover {
            background: rgba(216, 180, 254, 0.15);
        }

        .playlist {
            max-height: 80px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 4px;
            padding-right: 4px;
        }

        .playlist.show {
            display: flex;
        }

        .playlist-item {
            font-size: 0.75rem;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }

        .playlist-item:hover {
            background: rgba(255, 179, 128, 0.15);
        }

        .playlist-item.playing {
            color: var(--accent-orange);
            font-weight: 700;
            border-left: 2px solid var(--accent-orange);
            background: rgba(255, 179, 128, 0.1);
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-lilac);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="header">
            <div class="title"><i class="fa-solid fa-music"></i> Mi Música</div>
            <label class="btn-upload">
                <i class="fa-solid fa-folder-open"></i> Añadir MP3
                <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;">
            </label>
        </div>

        <div class="player-main">
            <div class="album-art" id="albumArt">
                <i class="fa-solid fa-compact-disc"></i>
            </div>
            <div class="track-info">
                <div class="track-title" id="trackTitle">Selecciona o añade música</div>
                <div class="track-artist" id="trackArtist">Biblioteca Local</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="shuffleBtn" title="Aleatorio"><i class="fa-solid fa-shuffle"></i></button>
            <button class="ctrl-btn" id="prevBtn" title="Anterior"><i class="fa-solid fa-backward-step"></i></button>
            <button class="play-pause-btn" id="playBtn" title="Reproducir"><i class="fa-solid fa-play" id="playIcon"></i></button>
            <button class="ctrl-btn" id="nextBtn" title="Siguiente"><i class="fa-solid fa-forward-step"></i></button>
            <button class="ctrl-btn" id="repeatBtn" title="Repetir"><i class="fa-solid fa-repeat"></i></button>
        </div>

        <div class="playlist-toggle" id="playlistToggle">
            <i class="fa-solid fa-list"></i> Ver lista (<span id="trackCount">0</span>)
        </div>

        <div class="playlist" id="playlistContainer"></div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const fileInput = document.getElementById('fileInput');
        const playlistContainer = document.getElementById('playlistContainer');
        const playlistToggle = document.getElementById('playlistToggle');
        const trackCount = document.getElementById('trackCount');
        const albumArt = document.getElementById('albumArt');

        let playlist = [];
        let currentIndex = 0;
        let isShuffle = false;
        let repeatMode = 0; // 0: Off, 1: All, 2: One

        // Cargar canciones guardadas localmente si existen
        const savedPlaylist = localStorage.getItem('widget_playlist');
        if (savedPlaylist) {
            try {
                playlist = JSON.parse(savedPlaylist);
                updatePlaylistUI();
                if (playlist.length > 0) {
                    loadTrack(0, false);
                }
            } catch(e) { console.error(e); }
        }

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                playlist.push({
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    url: URL.createObjectURL(file)
                });
            });
            updatePlaylistUI();
            if(audio.paused && playlist.length === files.length) {
                loadTrack(0, true);
            }
            saveState();
        });

        function saveState() {
            // Guardar nombres para referencia local
            const stateData = playlist.map(item => ({ name: item.name, url: item.url }));
            localStorage.setItem('widget_playlist', JSON.stringify(stateData));
        }

        function loadTrack(index, play = true) {
            if (playlist.length === 0) return;
            currentIndex = index;
            audio.src = playlist[currentIndex].url;
            trackTitle.textContent = playlist[currentIndex].name;
            trackArtist.textContent = "Biblioteca Local";
            updateActivePlaylistUI();
            if (play) {
                audio.play().then(() => {
                    playIcon.className = "fa-solid fa-pause";
                }).catch(err => console.log("Play error:", err));
            }
        }

        function togglePlay() {
            if (playlist.length === 0) {
                fileInput.click();
                return;
            }
            if (audio.paused) {
                audio.play();
                playIcon.className = "fa-solid fa-pause";
                albumArt.style.animation = "spin 4s linear infinite";
            } else {
                audio.pause();
                playIcon.className = "fa-solid fa-play";
                albumArt.style.animation = "none";
            }
        }

        playBtn.addEventListener('click', togglePlay);

        nextBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * playlist.length);
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            loadTrack(currentIndex, true);
        });

        prevBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex, true);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            if (repeatMode === 2) {
                audio.play();
            } else {
                nextBtn.click();
            }
        });

        progressBar.addEventListener('click', (e) => {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            if (repeatMode === 0) {
                repeatBtn.classList.remove('active');
                repeatBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
            } else if (repeatMode === 1) {
                repeatBtn.classList.add('active');
                repeatBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
            } else {
                repeatBtn.classList.add('active');
                repeatBtn.innerHTML = '<i class="fa-solid fa-repeat-1"></i>';
            }
        });

        playlistToggle.addEventListener('click', () => {
            playlistContainer.classList.toggle('show');
        });

        function updatePlaylistUI() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentIndex ? 'playing' : ''}`;
                item.textContent = `${index + 1}. ${track.name}`;
                item.addEventListener('click', () => {
                    loadTrack(index, true);
                });
                playlistContainer.appendChild(item);
            });
            trackCount.textContent = playlist.length;
        }

        function updateActivePlaylistUI() {
            const items = playlistContainer.querySelectorAll('.playlist-item');
            items.forEach((item, index) => {
                if (index === currentIndex) {
                    item.classList.add('playing');
                } else {
                    item.classList.remove('playing');
                }
            });
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
